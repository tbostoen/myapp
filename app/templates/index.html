{% extends "base.html" %}

{% block title %}Todo App{% endblock %}

{% block content %}
<h1>Hello world</h1>
<p class="subtitle">Simple FastAPI + Jinja Todo starter</p>

<form action="/todos" method="post" class="todo-form">
    <input type="text" name="text" placeholder="Enter a todo" required />
    <button type="submit">Add</button>
</form>

<ul class="todo-list">
    {% if todos %}
        {% for todo in todos %}
        <li class="{% if todo.completed %}completed{% endif %}">
            <span>{{ todo.text }}</span>
            <div class="todo-actions">
                <form action="/todos/{{ todo.id }}/toggle" method="post">
                    <button type="submit" class="secondary">
                        {% if todo.completed %}Undo{% else %}Complete{% endif %}
                    </button>
                </form>
                <form action="/todos/{{ todo.id }}/delete" method="post">
                    <button type="submit" class="danger">Delete</button>
                </form>
            </div>
        </li>
        {% endfor %}
    {% else %}
        <li class="empty">No todos yet.</li>
    {% endif %}
</ul>
{% endblock %}
